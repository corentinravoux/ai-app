name: CI

on:
  push:
  pull_request:

env:
  FLUTTER_VERSION: "3.47.7"

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Linux build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: llm-host tests
        run: python -I -m unittest discover -s host/tests -t . -v
      - name: webread tests
        run: python -I -m unittest discover -s tools/tests -t . -v
      - run: flutter build linux --release

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: flutter pub get
      - name: llm-host tests (no /proc on macOS)
        run: python -I -m unittest discover -s host/tests -t . -v
      - name: webread tests
        run: python -I -m unittest discover -s tools/tests -t . -v
      - run: flutter build macos --release

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
