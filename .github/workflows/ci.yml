name: CI

on:
  push:
  pull_request:

env:
  FLUTTER_VERSION: "3.47.7"

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Linux build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: llm-host tests
        run: python -I -m unittest discover -s host/tests -t . -v
      - name: webread tests
        run: python -I -m unittest discover -s tools/tests -t . -v
      - run: flutter build linux --release

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: flutter pub get
      - name: llm-host tests (no /proc on macOS)
        timeout-minutes: 10
        run: |
          set -o pipefail
          python -I -m unittest discover -s host/tests -t . -v 2>&1 | tee host-tests.log
      - name: failing llm-host tests as annotations
        if: failure()
        run: python .github/scripts/unittest_annotations.py host-tests.log
      - name: webread tests
        run: python -I -m unittest discover -s tools/tests -t . -v
      - run: flutter build macos --release

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
